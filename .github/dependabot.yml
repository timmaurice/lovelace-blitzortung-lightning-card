version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check for updates every week
    schedule:
      interval: 'weekly'
    # TypeScript 7 is deliberately held back: `typescript-eslint` still declares
    # `peer typescript: >=4.8.4 <6.1.0`, so a grouped bump that carries TypeScript 7 cannot be
    # installed at all — `npm ci` aborts on the peer conflict and the whole group is stuck.
    # Drop this once typescript-eslint supports it.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # jsdom 30.1 no longer exposes the Blob internals that vitest's jsdom environment reads in its
      # `URL.createObjectURL` shim, so every call with a Blob throws ("reading '_buffer'"). The card
      # does exactly that to start the MapLibre worker, and the map and worker tests fail. vitest
      # 5.0.2 is still affected. Drop this once vitest ships the fix from
      # https://github.com/vitest-dev/vitest/pull/11353 (issue vitest-dev/vitest#11336).
      - dependency-name: 'jsdom'
        versions:
          - '>=30.1.0'
    # Group all npm dependencies into a single pull request
    groups:
      npm-dependencies:
        patterns:
          - '*'

  # Keep the workflow actions current too. Without this entry Dependabot only
  # looked at npm, and actions/checkout and actions/setup-node fell a major behind.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
